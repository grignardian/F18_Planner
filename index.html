<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>F18 Timetable</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101014" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timetable">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "var(--clr-accent)",
            "surface-container-lowest": "var(--clr-card-bg)",
            "outline-variant": "var(--clr-border)",
            "on-surface-variant": "var(--clr-muted)",
            "primary": "var(--clr-accent)",
            "surface": "var(--clr-bg)",
            "on-surface": "var(--clr-text)",
            "background": "var(--clr-bg)"
          },
          fontFamily: {
            inter: ["Inter", "sans-serif"],
            sans: ["Inter", "sans-serif"],
            mono: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    body, input, button, select, textarea, h1, h2, h3, h4, h5, h6, p, div, a, label {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Light Theme Variables ── */
    :root {
      --clr-bg: #f8fafc;
      --clr-card-bg: #ffffff;
      --clr-card-active-bg: #faf5ff;
      --clr-border: #e2e8f0;
      --clr-text: #0f172a;
      --clr-muted: #64748b;
      --clr-accent: #7c3aed;
      --clr-accent-light: #a855f7;
      --clr-pill-bg: #ffffff;
      --clr-pill-active-bg: #7c3aed;
      --clr-pill-active-text: #ffffff;
      --clr-pill-active-day: #ede9fe;
      --clr-spine: rgba(124, 58, 237, 0.4);
      --clr-clock-bg: #f1f5f9;
      --clr-search-bg: #ffffff;
    }

    /* ── Dark Theme Variables (Default Matte Black/Purple) ── */
    html.dark {
      --clr-bg: #101014;
      --clr-card-bg: #16161a;
      --clr-card-active-bg: #1a1824;
      --clr-border: #26262b;
      --clr-text: #ffffff;
      --clr-muted: #90909a;
      --clr-accent: #c084fc;
      --clr-accent-light: #a855f7;
      --clr-pill-bg: #1c1c22;
      --clr-pill-active-bg: #2a1e3d;
      --clr-pill-active-text: #ffffff;
      --clr-pill-active-day: #c084fc;
      --clr-spine: rgba(168, 85, 247, 0.6);
      --clr-clock-bg: #1c1c22;
      --clr-search-bg: #18181c;
    }

    @layer base {
      html, body { width: 100%; margin: 0; padding: 0; background-color: var(--clr-bg); color: var(--clr-text); }
      body { overscroll-behavior: none; font-family: 'Inter', sans-serif; overflow-x: hidden; transition: background-color 0.25s ease, color 0.25s ease; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; }

    /* Slide Animations for Day Switching */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(65px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-right {
      animation: slideInRight 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-65px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-left {
      animation: slideInLeft 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease both; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6); transform: scale(1); }
      50% { box-shadow: 0 0 16px 4px rgba(168, 85, 247, 0.4); transform: scale(1.08); }
    }
    .active-node-glow {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Active tile card glow */
    @keyframes cardGlowDark {
      0%, 100% { box-shadow: 0 0 0 1px #a855f7, 0 0 20px rgba(168, 85, 247, 0.35); }
      50% { box-shadow: 0 0 0 2px #a855f7, 0 0 28px rgba(168, 85, 247, 0.55); }
    }
    html.dark .active-tile-glow {
      animation: cardGlowDark 2.5s ease-in-out infinite;
    }

    @keyframes cardGlowLight {
      0%, 100% { box-shadow: 0 0 0 1px #7c3aed, 0 0 16px rgba(124, 58, 237, 0.2); }
      50% { box-shadow: 0 0 0 2px #7c3aed, 0 0 24px rgba(124, 58, 237, 0.35); }
    }
    html:not(.dark) .active-tile-glow {
      animation: cardGlowLight 2.5s ease-in-out infinite;
    }

    /* Tile Hover Card Lift */
    .tile-hover {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .tile-hover:hover {
      transform: translateY(-4px);
    }
    html.dark .tile-hover:hover {
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.6), 0 0 16px rgba(168, 85, 247, 0.2);
    }
    html:not(.dark) .tile-hover:hover {
      box-shadow: 0 12px 24px -4px rgba(124, 58, 237, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    /* Desktop shell constraint */
    @media (min-width: 768px) {
      .app-shell { max-width: 540px; margin: 0 auto; }
    }
  </style>
</head>

<body class="bg-[var(--clr-bg)] text-[var(--clr-text)] font-inter min-h-screen flex flex-col antialiased selection:bg-[#a855f7] selection:text-white">
  <script>
    (function() {
      const saved = localStorage.getItem('f18-dark-mode');
      if (saved === 'true' || saved === null) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Unregister any old service worker caches to force immediate update
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    })();
  </script>

  <!-- ============ APP SHELL CONTAINER ============ -->
  <div class="app-shell flex flex-col min-h-screen w-full px-4 pt-4 pb-12">

    <!-- ============ TOP HEADER ============ -->
    <header class="flex items-center justify-between pt-safe pb-3 animate-fade-in">
      <div>
        <p class="text-[11px] font-bold tracking-wider text-[var(--clr-muted)] uppercase font-inter">TIMETABLE MANAGER</p>
        <h1 class="text-2xl font-bold tracking-tight text-[var(--clr-text)] font-inter">F18 - Sem 3</h1>
      </div>
      <div class="flex items-center gap-2.5">
        <div class="px-2.5 py-1 rounded-full bg-[var(--clr-clock-bg)] border border-[var(--clr-border)] text-[var(--clr-muted)] text-xs font-inter font-medium flex items-center gap-1.5 shadow-sm" id="live-clock-badge">
          <span class="w-2 h-2 rounded-full bg-[var(--clr-accent)] animate-pulse"></span>
          <span id="live-clock"></span>
        </div>
        <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle theme"
          class="w-9 h-9 rounded-full bg-[var(--clr-clock-bg)] border border-[var(--clr-border)] text-[var(--clr-muted)] hover:text-[var(--clr-text)] flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-sm">
          <span class="material-symbols-outlined text-[19px]" id="theme-icon">dark_mode</span>
        </button>
      </div>
    </header>

    <!-- ============ TITLE SECTION ============ -->
    <div class="mt-3 mb-4 animate-fade-in">
      <h2 class="text-3xl font-extrabold tracking-tight text-[var(--clr-text)] font-inter">
        Daily <span class="text-[var(--clr-accent)]">Schedule</span>
      </h2>
      <p class="text-[var(--clr-muted)] text-sm mt-1 font-inter">Search, review, and track your daily class schedule.</p>
    </div>

    <!-- ============ SEARCH BAR ============ -->
    <div class="relative w-full mb-4 flex items-center animate-fade-in">
      <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--clr-muted)] text-[20px] pointer-events-none">search</span>
      <input type="text" id="search-input" oninput="onSearchInput(this.value)"
        placeholder="Search classes, rooms, or subjects..."
        class="w-full bg-[var(--clr-search-bg)] border border-[var(--clr-border)] focus:border-[var(--clr-accent)]/80 focus:ring-1 focus:ring-[var(--clr-accent)]/50 rounded-2xl py-2.5 pl-11 pr-4 text-sm text-[var(--clr-text)] placeholder:text-[var(--clr-muted)] outline-none transition-all shadow-inner font-inter">
    </div>

    <!-- ============ DAY SELECTION BAR ============ -->
    <div class="flex flex-col mb-5 animate-fade-in">
      <!-- Full-width 5-column grid for day buttons -->
      <div class="grid grid-cols-5 gap-1.5 w-full" id="day-pill-filters">
        <!-- Generated JS day pills -->
      </div>
      
      <!-- Sub-bar info row -->
      <div class="flex items-center justify-between mt-2.5 px-0.5">
        <span class="text-xs font-bold text-[var(--clr-accent)] font-inter" id="records-count-label">5 classes</span>
        <span class="text-[11px] text-[var(--clr-muted)] font-inter opacity-75">swipe left or right to change day</span>
      </div>
    </div>

    <!-- ============ HERO ACTIVE/NEXT CLASS TILE ============ -->
    <div id="hero-card" class="hidden relative w-full rounded-2xl bg-[var(--clr-card-bg)] border border-[var(--clr-border)] p-5 shadow-xl mb-5 overflow-hidden">
      <div class="absolute -right-12 -top-12 w-40 h-40 rounded-full bg-[var(--clr-accent)]/10 blur-3xl pointer-events-none"></div>
      <div class="flex flex-col" id="hero-content"></div>
    </div>

    <!-- ============ TIMELINE & TILES CONTAINER (Sliding Viewport) ============ -->
    <div id="day-slide-viewport" class="w-full">
      <div id="class-tiles-container" class="flex flex-col w-full"></div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center animate-fade-in">
      <span class="material-symbols-outlined text-[48px] text-[var(--clr-muted)] mb-3 opacity-60">event_busy</span>
      <p class="text-lg text-[var(--clr-text)] font-semibold font-inter">No classes scheduled</p>
      <p class="text-sm text-[var(--clr-muted)] mt-1 font-inter">Enjoy your free time.</p>
    </div>

  </div>

  <!-- ============ SCRIPTS ============ -->
  <script>
    let scheduleData = {};
    let currentDay = '';
    let searchQuery = '';

    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const DAY_ABBR = ['MON', 'TUE', 'WED', 'THU', 'FRI'];
    const ALL_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function getActualDayName() {
      return ALL_DAYS[new Date().getDay()];
    }

    function getMondayOfWeek(d = new Date()) {
      const day = d.getDay();
      const monday = new Date(d);
      if (day === 0) monday.setDate(d.getDate() + 1);
      else if (day === 6) monday.setDate(d.getDate() + 2);
      else monday.setDate(d.getDate() - (day - 1));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    async function init() {
      updateClock();
      setInterval(updateClock, 1000);

      // Initialize theme icon correctly
      initDarkMode();

      try {
        const resp = await fetch('schedule.json?' + Date.now());
        scheduleData = await resp.json();
      } catch (e) {
        console.error('Failed to load schedule.json', e);
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      const todayIndex = new Date().getDay();
      if (todayIndex >= 1 && todayIndex <= 5) {
        currentDay = DAYS[todayIndex - 1];
      } else {
        currentDay = 'Monday';
      }

      renderDayPills();
      renderDay(currentDay, true, 'next');

      let lastMinute = nowMinutes();
      setInterval(() => {
        const currentMin = nowMinutes();
        if (currentMin !== lastMinute) {
          lastMinute = currentMin;
          renderDay(currentDay, false, null);
        }
      }, 5000);
    }

    function updateClock() {
      const now = new Date();
      const dayAbbr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][now.getDay()];
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      document.getElementById('live-clock').textContent = `${dayAbbr} - ${String(hh).padStart(2, '0')}:${m} ${ampm}`;
    }

    // ── Theme Switcher ──
    function initDarkMode() {
      const saved = localStorage.getItem('f18-dark-mode');
      const isDark = saved === 'true' || saved === null;
      applyDarkMode(isDark);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.contains('dark');
      applyDarkMode(!isDark);
      localStorage.setItem('f18-dark-mode', !isDark);
    }

    function applyDarkMode(isDark) {
      const icon = document.getElementById('theme-icon');
      const metaTheme = document.getElementById('meta-theme-color');

      if (isDark) {
        document.documentElement.classList.add('dark');
        if (icon) icon.textContent = 'light_mode';
        if (metaTheme) metaTheme.setAttribute('content', '#101014');
      } else {
        document.documentElement.classList.remove('dark');
        if (icon) icon.textContent = 'dark_mode';
        if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
      }
    }

    function renderDayPills() {
      const container = document.getElementById('day-pill-filters');
      const monday = getMondayOfWeek(new Date());

      container.innerHTML = DAYS.map((day, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const isSelected = day === currentDay;
        const pillActiveCls = 'bg-[var(--clr-pill-active-bg)] border border-[var(--clr-accent)]/70 text-[var(--clr-pill-active-text)] shadow-md scale-[1.02]';
        const pillInactiveCls = 'bg-[var(--clr-pill-bg)] border border-[var(--clr-border)] text-[var(--clr-muted)] hover:text-[var(--clr-text)] hover:border-[var(--clr-accent)]/40';

        return `
          <button onclick="switchDay('${day}')" class="flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl transition-all duration-200 w-full font-inter ${isSelected ? pillActiveCls : pillInactiveCls}">
            <span class="text-[10px] font-extrabold uppercase tracking-wider ${isSelected ? 'text-[var(--clr-pill-active-day)]' : 'text-[var(--clr-muted)]'}">${DAY_ABBR[i]}</span>
            <span class="text-sm font-bold mt-0.5 ${isSelected ? 'text-[var(--clr-pill-active-text)]' : 'text-[var(--clr-muted)]'}">${d.getDate()}</span>
          </button>
        `;
      }).join('');
    }

    function switchDay(targetDay, forceDirection = null) {
      if (!DAYS.includes(targetDay) || targetDay === currentDay) return;
      const currentIdx = DAYS.indexOf(currentDay);
      const targetIdx = DAYS.indexOf(targetDay);

      const direction = forceDirection || (targetIdx > currentIdx ? 'next' : 'prev');
      currentDay = targetDay;

      renderDayPills();
      renderDay(targetDay, true, direction);
    }

    function cycleNextDay() {
      const idx = DAYS.indexOf(currentDay);
      const nextIdx = (idx + 1) % DAYS.length;
      switchDay(DAYS[nextIdx], 'next');
    }

    function onSearchInput(val) {
      searchQuery = val.trim().toLowerCase();
      renderDay(currentDay, false, null);
    }

    function parseTime(timeStr) {
      if (!timeStr) return 0;
      const cleaned = timeStr.trim().toLowerCase();
      const isPM = cleaned.includes('pm');
      const isAM = cleaned.includes('am');
      const numPart = cleaned.replace(/[apm\s]/g, '');
      const parts = numPart.split(':');
      let h = parseInt(parts[0], 10) || 0;
      let m = parseInt(parts[1], 10) || 0;

      if (isPM && h < 12) h += 12;
      else if (isAM && h === 12) h = 0;
      else if (!isPM && !isAM && h >= 1 && h <= 7) h += 12;

      return h * 60 + m;
    }

    function parseTimeRange(rangeStr) {
      if (!rangeStr) return { start: 0, end: 0 };
      const parts = rangeStr.split(/[–—-]/).map(s => s.trim());
      if (parts.length < 2) return { start: 0, end: 0 };
      let start = parseTime(parts[0]);
      let end = parseTime(parts[1]);
      if (end <= start && end < 12 * 60) end += 12 * 60;
      return { start, end };
    }

    function formatTime12(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      return `${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function nowMinutes() {
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes();
    }

    function renderDay(day, withAnimation = false, slideDirection = 'next') {
      const viewport = document.getElementById('day-slide-viewport');
      const container = document.getElementById('class-tiles-container');
      const heroCard  = document.getElementById('hero-card');
      const emptyState = document.getElementById('empty-state');
      const recordsCountLabel = document.getElementById('records-count-label');

      const monday = getMondayOfWeek(new Date());
      const dayIndex = DAYS.indexOf(day);
      const targetDate = new Date(monday);
      targetDate.setDate(monday.getDate() + dayIndex);

      const rawEntries = (scheduleData.schedule && scheduleData.schedule[day]) || [];

      let filtered = rawEntries;
      if (searchQuery) {
        filtered = filtered.filter(e => 
          (e.subject && e.subject.toLowerCase().includes(searchQuery)) ||
          (e.room && e.room.toLowerCase().includes(searchQuery)) ||
          (e.type && e.type.toLowerCase().includes(searchQuery))
        );
      }

      recordsCountLabel.textContent = `${filtered.length} classes`;

      // Apply slide transition animation class to viewport
      if (withAnimation && slideDirection) {
        viewport.classList.remove('animate-slide-right', 'animate-slide-left');
        void viewport.offsetWidth; // trigger reflow
        const animClass = slideDirection === 'next' ? 'animate-slide-right' : 'animate-slide-left';
        viewport.classList.add(animClass);
      }

      if (filtered.length === 0) {
        container.innerHTML = '';
        heroCard.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const now = nowMinutes();
      const actualTodayName = getActualDayName();
      const isToday = (day === actualTodayName);

      // Hero Card
      let currentClass = null;
      let nextClass = null;
      if (isToday) {
        for (const entry of rawEntries) {
          if (entry.type === 'break') continue;
          const { start, end } = parseTimeRange(entry.time);
          if (now >= start && now < end) currentClass = entry;
          if (now < start && !nextClass) nextClass = entry;
        }
      }

      if (currentClass) {
        renderHero(currentClass, 'now');
        heroCard.classList.remove('hidden');
      } else if (nextClass && isToday) {
        renderHero(nextClass, 'next');
        heroCard.classList.remove('hidden');
      } else {
        heroCard.classList.add('hidden');
      }

      // Render Each Class Tile with Timeline Node
      let html = '';
      filtered.forEach((entry, idx) => {
        const { start, end } = parseTimeRange(entry.time);
        const isPast = isToday && now >= end;
        const isActive = isToday && now >= start && now < end;

        // Timeline Node Icon
        let timelineNodeHtml = '';
        if (isActive) {
          timelineNodeHtml = `
            <div class="w-7 h-7 rounded-full bg-[var(--clr-accent)] border-2 border-[var(--clr-pill-active-text)] flex items-center justify-center shrink-0 z-10 active-node-glow my-0.5">
              <span class="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
            </div>`;
        } else if (isPast) {
          timelineNodeHtml = `
            <div class="w-6 h-6 rounded-full bg-[var(--clr-pill-active-bg)] border border-[var(--clr-border)] flex items-center justify-center shrink-0 text-[var(--clr-accent)] shadow-sm z-10 my-0.5">
              <span class="material-symbols-outlined text-[13px]">check</span>
            </div>`;
        } else {
          timelineNodeHtml = `
            <div class="w-6 h-6 rounded-full bg-[var(--clr-card-bg)] border border-[var(--clr-accent)]/60 flex items-center justify-center shrink-0 z-10 my-0.5">
              <span class="w-2 h-2 rounded-full bg-[var(--clr-accent)]"></span>
            </div>`;
        }

        // Icon block styling
        let iconBgCls = 'bg-[#e9d5ff] text-[#581c87]';
        let iconName = 'auto_stories';

        if (entry.type === 'lab') {
          iconBgCls = 'bg-[#ddd6fe] text-[#4c1d95]';
          iconName = 'science';
        } else if (entry.type === 'tutorial') {
          iconBgCls = 'bg-[#e0e7ff] text-[#3730a3]';
          iconName = 'groups';
        } else if (entry.type === 'break') {
          iconBgCls = 'bg-[#fbcfe8] text-[#9f1239]';
          iconName = entry.icon || 'coffee';
        }

        const typeLabel = entry.type === 'lab' ? 'Lab' : entry.type === 'tutorial' ? 'Tutorial' : entry.type === 'break' ? 'Break' : 'Lecture';
        const formattedTimeStr = entry.time ? `${formatTime12(start)} - ${formatTime12(end)}` : '09:00 AM';

        // Ongoing progress bar for active tile
        let progressHtml = '';
        if (isActive) {
          const elapsed = Math.max(0, now - start);
          const total = Math.max(1, end - start);
          const remaining = Math.max(0, end - now);
          const progressPct = Math.min(100, Math.round((elapsed / total) * 100));
          progressHtml = `
            <div class="mt-3 pt-3 border-t border-[var(--clr-border)]">
              <div class="flex items-center justify-between text-xs font-inter mb-1.5">
                <span class="text-[var(--clr-accent)] font-bold flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px]">timelapse</span>
                  ${remaining}m remaining
                </span>
                <span class="font-bold text-[var(--clr-accent)]">${progressPct}%</span>
              </div>
              <div class="w-full h-1.5 bg-[var(--clr-border)] rounded-full overflow-hidden">
                <div class="h-full bg-[var(--clr-accent-light)] rounded-full transition-all duration-500" style="width:${progressPct}%"></div>
              </div>
            </div>
          `;
        }

        // Status pill badge
        let statusBadge = '';
        if (isActive) {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-[var(--clr-accent-light)] text-white text-[11px] font-extrabold uppercase tracking-wider">HAPPENING NOW</span>`;
        } else if (isPast) {
          statusBadge = `<span class="px-2 py-0.5 rounded-md bg-[var(--clr-card-bg)] text-[var(--clr-muted)] text-xs font-semibold flex items-center gap-1 border border-[var(--clr-border)]"><span class="material-symbols-outlined text-[14px] text-[var(--clr-accent)]">check_circle</span> DONE</span>`;
        } else {
          statusBadge = `<span class="px-2 py-0.5 rounded-md bg-[var(--clr-card-bg)] text-[var(--clr-muted)] text-xs font-medium border border-[var(--clr-border)]">${typeLabel}</span>`;
        }

        const roomPillHtml = (entry.room && entry.room.trim() !== '') ? `
                <!-- Right Room Pill Tag -->
                <div class="shrink-0">
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[var(--clr-card-bg)] border border-[var(--clr-border)] text-[var(--clr-text)] text-xs font-semibold font-inter shadow-inner">
                    <span class="material-symbols-outlined text-[15px] text-[var(--clr-accent)]">meeting_room</span>
                    ${entry.room}
                  </span>
                </div>
        ` : '';

        const spineTopLineCls = idx === 0 ? 'opacity-0' : (isPast ? 'bg-[var(--clr-accent)]/50' : 'bg-[var(--clr-border)]');
        const spineBottomLineCls = idx === filtered.length - 1 ? 'opacity-0' : (isPast ? 'bg-[var(--clr-accent)]/50' : 'bg-[var(--clr-border)]');

        html += `
          <div class="flex items-stretch gap-3 w-full">
            <!-- Left Side Timeline Spine Column -->
            <div class="flex flex-col items-center shrink-0 w-7 relative">
              <div class="w-[2px] h-4 ${spineTopLineCls} shrink-0"></div>
              ${timelineNodeHtml}
              <div class="w-[2px] flex-1 ${spineBottomLineCls}"></div>
            </div>

            <!-- Standalone Tile Card -->
            <div class="flex-1 pb-4 min-w-0">
              <div class="relative w-full rounded-2xl bg-[var(--clr-card-bg)] border border-[var(--clr-border)] p-4 tile-hover ${isActive ? 'active-tile-glow bg-[var(--clr-card-active-bg)] border-[var(--clr-accent)]/70' : ''} ${isPast ? 'opacity-65' : ''}">
                
                <!-- Top Tile Header Row -->
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-[var(--clr-accent)] font-inter">${formattedTimeStr}</span>
                  </div>
                  <div>${statusBadge}</div>
                </div>

                <!-- Tile Body Info -->
                <div class="flex items-start justify-between gap-3">
                  <div class="flex items-start gap-3 flex-1 min-w-0">
                    <!-- Large Pastel Icon Container -->
                    <div class="w-12 h-12 rounded-2xl ${iconBgCls} flex items-center justify-center shrink-0 shadow-sm mt-0.5">
                      <span class="material-symbols-outlined text-[22px]">${iconName}</span>
                    </div>

                    <!-- Subject Title & Type -->
                    <div class="flex flex-col min-w-0">
                      <h3 class="text-lg font-bold text-[var(--clr-text)] tracking-tight leading-snug font-inter truncate">${entry.subject || 'Break'}</h3>
                      <p class="text-xs text-[var(--clr-muted)] mt-0.5 font-inter">${typeLabel}</p>
                    </div>
                  </div>

                  ${roomPillHtml}
                </div>

                ${progressHtml}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderHero(entry, mode) {
      const heroContent = document.getElementById('hero-content');
      const { start, end } = parseTimeRange(entry.time);
      const now = nowMinutes();

      if (mode === 'now') {
        const remaining = Math.max(0, end - now);
        const elapsed = now - start;
        const total = Math.max(1, end - start);
        const pct = Math.min(100, Math.round((elapsed / total) * 100));

        heroContent.innerHTML = `
          <div class="flex items-center justify-between mb-2 font-inter">
            <span class="px-2.5 py-0.5 rounded-full bg-[var(--clr-accent-light)] text-white text-[11px] font-extrabold uppercase tracking-wider">HAPPENING NOW</span>
            <span class="text-xs font-bold text-[var(--clr-accent)]">${remaining}m remaining</span>
          </div>
          <h3 class="text-xl font-bold text-[var(--clr-text)] tracking-tight font-inter">${entry.subject}</h3>
          <p class="text-xs text-[var(--clr-muted)] mt-0.5 font-inter">${formatTime12(start)} - ${formatTime12(end)} ${entry.room && entry.room.trim() !== "" ? " • Room: " + entry.room : ""}</p>
          <div class="w-full h-1.5 bg-[var(--clr-border)] rounded-full overflow-hidden mt-3">
            <div class="h-full bg-[var(--clr-accent)] rounded-full transition-all duration-500" style="width:${pct}%"></div>
          </div>
        `;
      } else {
        const minsUntil = Math.max(0, start - now);
        heroContent.innerHTML = `
          <div class="flex items-center justify-between mb-2 font-inter">
            <span class="px-2.5 py-0.5 rounded-full bg-[var(--clr-border)] text-[var(--clr-text)] text-[11px] font-bold uppercase tracking-wider">UP NEXT</span>
            <span class="text-xs font-bold text-[var(--clr-accent)]">In ${minsUntil} mins</span>
          </div>
          <h3 class="text-xl font-bold text-[var(--clr-text)] tracking-tight font-inter">${entry.subject}</h3>
          <p class="text-xs text-[var(--clr-muted)] mt-0.5 font-inter">${formatTime12(start)} - ${formatTime12(end)} ${entry.room && entry.room.trim() !== "" ? " • Room: " + entry.room : ""}</p>
        `;
      }
    }

    // Touch Swipe Gesture Handler with Slide Animation
    (function() {
      let startX = 0, startY = 0;
      document.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          const idx = DAYS.indexOf(currentDay);
          if (dx < 0 && idx < DAYS.length - 1) {
            switchDay(DAYS[idx + 1], 'next');
          } else if (dx > 0 && idx > 0) {
            switchDay(DAYS[idx - 1], 'prev');
          }
        }
      }, { passive: true });
    })();

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
